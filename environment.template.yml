name: beyond_lora
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - pytorch>=2.1
  - torchvision>=0.16
  - pytorch-cuda=12.1
  - numpy
  - scipy
  - scikit-learn
  - scikit-image
  - matplotlib
  - pillow
  - h5py
  - requests
  - pip:
      - transformers>=4.40.0
      - datasets>=2.18.0
      - tokenizers>=0.15.0
      - accelerate>=0.27.0
      - sentencepiece>=0.1.99
      - protobuf>=3.20.0
      - pyarrow>=14.0.0
      - timm>=0.9.12
      - wandb>=0.16.0
      - opencv-python>=4.8.0
